# App Store Connect builds: the iPhone / iPad and Apple Vision Pro apps, archived, signed for the
# App Store and uploaded to TestFlight (or submitted for App Review).
#
# Runs by hand (Actions ▸ App Store ▸ Run workflow) or on a pushed tag vX.Y.Z (TestFlight). Only
# in kristenadd/daytona-3-nse-decomp: forks have none of the inputs below.
#
# This repository is public, so nothing the build makes from the game leaves the job: the .ipa,
# the archive, the translated code and the pictures are never uploaded as artifacts or cached.
# They go to App Store Connect only.
#
# Inputs that are not in this repository:
#   - the prepared game images (DCUSA2019.cache, DCUSA2017.cache) and the boot screen titles,
#     from the private repository ASSETS_REPO (default kristenadd/daytona-ci-assets), cloned
#     with a read-only deploy key;
#   - the logo and icons (branding.ini's pictures, tools/branding/README.md), from secrets. Only
#     this workflow builds with them; local builds keep using branding.ini or the generic set.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions); ~/Projects/SigningSecrets sets them all
# (repos.conf line kristenadd/daytona-3-nse-decomp):
#   APPLE_DEVELOPMENT_P12_BASE64      "Apple Development" certificate + key, .p12, base64 (archive)
#   APPLE_DEVELOPMENT_P12_PASSWORD
#   APPLE_DISTRIBUTION_P12_BASE64     "Apple Distribution" certificate + key (App Store export)
#   APPLE_DISTRIBUTION_P12_PASSWORD
#   NOTARY_API_KEY_P8                 App Store Connect API key: the .p8 text, its key ID and
#   NOTARY_API_KEY_ID                 issuer ID. Makes the profiles (needs access to Certificates,
#   NOTARY_API_ISSUER_ID              Identifiers & Profiles: Admin), uploads and submits.
#   ASSETS_DEPLOY_KEY                 SSH private key, read-only deploy key of ASSETS_REPO
#   BRANDING_B64_COUNT                the pictures: a .tar.gz of the branding folder's *.png in
#   BRANDING_B64_01 ..                base64, split into COUNT secrets (GitHub allows 48 KB each;
#                                     the workflow names slots 01 to 40)
# Variables:
#   IOS_BUNDLE_ID                     the bundle id (registered for the team; one App Store
#                                     Connect app with an iOS and a visionOS platform)
#   ASSETS_REPO                       optional, default kristenadd/daytona-ci-assets
#   TESTFLIGHT_GROUPS                 optional: TestFlight groups a tag push gives the build to
#   XCODE_VERSION                     optional, e.g. 26.2 (default: the newest on the runner)
#
# The App Store Connect app is made once by hand (App Store Connect ▸ Apps ▸ +, then Add Platform
# ▸ visionOS on its page); an API key can't. Without it a tag push only warns.
#
# Versions: a tag vX.Y.Z is version X.Y.Z; a run by hand takes its "version" input, or the newest
# vX.Y.Z tag, or 1.0.0. The build number is the run number, so a re-run of the same run can't
# upload again (start a new run).

name: App Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: testflight uploads; review uploads and submits for App Review; build checks the build only
        type: choice
        options: [testflight, review, build]
        default: testflight
      platforms:
        description: Which apps
        type: choice
        options: [both, ios, visionos]
        default: both
      version:
        description: Version (X.Y.Z; empty = the newest vX.Y.Z tag, or 1.0.0)
        type: string
        default: ''
      testflight_groups:
        description: TestFlight groups to give the build to (comma-separated; empty = internal testers only)
        type: string
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

env:
  APPLE_TEAM_ID: B4H429V95D

jobs:
  setup:
    name: Version
    if: github.repository == 'kristenadd/daytona-3-nse-decomp'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      mode: ${{ steps.v.outputs.mode }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          VERSION_INPUT: ${{ inputs.version }}
          MODE_INPUT: ${{ inputs.mode }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}; mode=testflight-soft; platforms=both
          else
            last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            last=${last#v}
            version=${VERSION_INPUT:-${last:-1.0.0}}; mode=$MODE_INPUT; platforms=$PLATFORMS_INPUT
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Version $version isn't X.Y.Z"; exit 1; }
          ios='{"platform":"ios","preset":"ios-device","destination":"generic/platform=iOS","fastlane":"ios"}'
          vision='{"platform":"visionos","preset":"visionos-device","destination":"generic/platform=visionOS","fastlane":"xros"}'
          case $platforms in
            ios) matrix="[$ios]" ;; visionos) matrix="[$vision]" ;; *) matrix="[$ios,$vision]" ;;
          esac
          echo "Version $version, build ${{ github.run_number }}, mode $mode, platforms $platforms"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  app:
    name: ${{ matrix.platform }}
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ASSETS: ${{ github.workspace }}/build/ci-assets
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -n "${{ vars.XCODE_VERSION }}" ]; then xcode="/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"
          else xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check secrets
        env:
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          DEV: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DIST: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DEPLOY: ${{ secrets.ASSETS_DEPLOY_KEY }}
          PICS: ${{ secrets.BRANDING_B64_COUNT }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          for v in KEY:NOTARY_API_KEY_P8 DEV:APPLE_DEVELOPMENT_P12_BASE64 DIST:APPLE_DISTRIBUTION_P12_BASE64 \
                   DEPLOY:ASSETS_DEPLOY_KEY PICS:BRANDING_B64_COUNT BUNDLE:IOS_BUNDLE_ID; do
            eval "[ -n \"\$${v%%:*}\" ]" || { echo "::error::${v#*:} isn't set (see the comment at the top of this workflow)"; exit 1; }
          done

      - name: Fetch the game inputs
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSETS_REPO || 'kristenadd/daytona-ci-assets' }}
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: build/ci-assets
          persist-credentials: false

      # The pictures: BRANDING_B64_01 .. _COUNT, each named (not the whole secrets context, which
      # makes GitHub hold the workflow), ten to a step (all at once overflow the process
      # environment), appended to one file, then decoded and unpacked with a branding.ini.
      - name: Logo and icons, pieces 01-10
        env:
          COUNT: ${{ secrets.BRANDING_B64_COUNT }}
          P01: ${{ secrets.BRANDING_B64_01 }}
          P02: ${{ secrets.BRANDING_B64_02 }}
          P03: ${{ secrets.BRANDING_B64_03 }}
          P04: ${{ secrets.BRANDING_B64_04 }}
          P05: ${{ secrets.BRANDING_B64_05 }}
          P06: ${{ secrets.BRANDING_B64_06 }}
          P07: ${{ secrets.BRANDING_B64_07 }}
          P08: ${{ secrets.BRANDING_B64_08 }}
          P09: ${{ secrets.BRANDING_B64_09 }}
          P10: ${{ secrets.BRANDING_B64_10 }}
        run: |
          [ "$COUNT" -le 40 ] || { echo "::error::BRANDING_B64_COUNT is $COUNT; the workflow reads 40 pieces: add slots"; exit 1; }
          for i in $(seq 1 10); do
            [ "$i" -le "$COUNT" ] || break
            v=P$(printf %02d "$i"); printf '%s' "${!v}" >> "$RUNNER_TEMP/branding.b64"
          done

      - name: Logo and icons, pieces 11-20
        env:
          COUNT: ${{ secrets.BRANDING_B64_COUNT }}
          P11: ${{ secrets.BRANDING_B64_11 }}
          P12: ${{ secrets.BRANDING_B64_12 }}
          P13: ${{ secrets.BRANDING_B64_13 }}
          P14: ${{ secrets.BRANDING_B64_14 }}
          P15: ${{ secrets.BRANDING_B64_15 }}
          P16: ${{ secrets.BRANDING_B64_16 }}
          P17: ${{ secrets.BRANDING_B64_17 }}
          P18: ${{ secrets.BRANDING_B64_18 }}
          P19: ${{ secrets.BRANDING_B64_19 }}
          P20: ${{ secrets.BRANDING_B64_20 }}
        run: |
          [ "$COUNT" -le 40 ] || { echo "::error::BRANDING_B64_COUNT is $COUNT; the workflow reads 40 pieces: add slots"; exit 1; }
          for i in $(seq 11 20); do
            [ "$i" -le "$COUNT" ] || break
            v=P$(printf %02d "$i"); printf '%s' "${!v}" >> "$RUNNER_TEMP/branding.b64"
          done

      - name: Logo and icons, pieces 21-30
        env:
          COUNT: ${{ secrets.BRANDING_B64_COUNT }}
          P21: ${{ secrets.BRANDING_B64_21 }}
          P22: ${{ secrets.BRANDING_B64_22 }}
          P23: ${{ secrets.BRANDING_B64_23 }}
          P24: ${{ secrets.BRANDING_B64_24 }}
          P25: ${{ secrets.BRANDING_B64_25 }}
          P26: ${{ secrets.BRANDING_B64_26 }}
          P27: ${{ secrets.BRANDING_B64_27 }}
          P28: ${{ secrets.BRANDING_B64_28 }}
          P29: ${{ secrets.BRANDING_B64_29 }}
          P30: ${{ secrets.BRANDING_B64_30 }}
        run: |
          [ "$COUNT" -le 40 ] || { echo "::error::BRANDING_B64_COUNT is $COUNT; the workflow reads 40 pieces: add slots"; exit 1; }
          for i in $(seq 21 30); do
            [ "$i" -le "$COUNT" ] || break
            v=P$(printf %02d "$i"); printf '%s' "${!v}" >> "$RUNNER_TEMP/branding.b64"
          done

      - name: Logo and icons, pieces 31-40
        env:
          COUNT: ${{ secrets.BRANDING_B64_COUNT }}
          P31: ${{ secrets.BRANDING_B64_31 }}
          P32: ${{ secrets.BRANDING_B64_32 }}
          P33: ${{ secrets.BRANDING_B64_33 }}
          P34: ${{ secrets.BRANDING_B64_34 }}
          P35: ${{ secrets.BRANDING_B64_35 }}
          P36: ${{ secrets.BRANDING_B64_36 }}
          P37: ${{ secrets.BRANDING_B64_37 }}
          P38: ${{ secrets.BRANDING_B64_38 }}
          P39: ${{ secrets.BRANDING_B64_39 }}
          P40: ${{ secrets.BRANDING_B64_40 }}
        run: |
          [ "$COUNT" -le 40 ] || { echo "::error::BRANDING_B64_COUNT is $COUNT; the workflow reads 40 pieces: add slots"; exit 1; }
          for i in $(seq 31 40); do
            [ "$i" -le "$COUNT" ] || break
            v=P$(printf %02d "$i"); printf '%s' "${!v}" >> "$RUNNER_TEMP/branding.b64"
          done

      - name: Unpack the logo and icons
        run: |
          dir="$RUNNER_TEMP/branding"; mkdir -p "$dir"
          base64 --decode -i "$RUNNER_TEMP/branding.b64" -o "$dir/branding.tar.gz"
          rm "$RUNNER_TEMP/branding.b64"
          tar -xzf "$dir/branding.tar.gz" -C "$dir"; rm "$dir/branding.tar.gz"
          ls -l "$dir"
          ini="$dir/branding.ini"; : > "$ini"
          for pair in logo:logo.png icon:icon-1024.png vision_back:icon-vision-back.png vision_front:icon-vision-front.png; do
            [ -f "$dir/${pair#*:}" ] && echo "${pair%%:*} = $dir/${pair#*:}" >> "$ini"
          done
          echo "BRANDING_INI=$ini" >> "$GITHUB_ENV"

      - name: Translator packages
        run: python3 -m pip install --target build/pylib capstone==5.0.3

      - name: Install the signing certificates and the API key
        env:
          DEV_P12: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DEV_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DIST_P12: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for pair in "DEV_P12:DEV_PASSWORD" "DIST_P12:DIST_PASSWORD"; do
            eval "data=\$${pair%%:*}; password=\$${pair#*:}"
            printf '%s' "$data" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$password" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -P "$RUNNER_TEMP/cert.p12"
          done
          # Apple's WWDR intermediate (G3) for the development / distribution chain.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          if ! output=$(security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" 2>&1); then
            [[ "$output" == *"already exists"* ]] || { echo "$output"; exit 1; }
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # Configuring translates both editions (tools/x86tr) into build/x86tr.
      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} -DDCUSA_IOS_TEAM="$APPLE_TEAM_ID" \
            -DDCUSA_IOS_BUNDLE_ID="${{ vars.IOS_BUNDLE_ID }}" \
            -DDCUSA_PREPARED_CACHE="$ASSETS/DCUSA2019.cache;$ASSETS/DCUSA2017.cache" \
            -DDCUSA_BOOT_TITLE="$ASSETS/boot/title.png" \
            -DDCUSA_BRANDING_FILE="$BRANDING_INI" \
            -DDCUSA_APP_VERSION="${{ needs.setup.outputs.version }}" \
            -DDCUSA_BUILD_NUMBER="${{ github.run_number }}"

      - name: Archive
        run: |
          xcodebuild -project build/${{ matrix.preset }}/DaytonaUSA.xcodeproj -scheme DaytonaUSA \
            -configuration RelWithDebInfo -destination ${{ matrix.destination }} \
            -archivePath "$RUNNER_TEMP/DaytonaUSA.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.NOTARY_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.NOTARY_API_ISSUER_ID }}" \
            -quiet archive
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties' "$RUNNER_TEMP/DaytonaUSA.xcarchive/Info.plist"

      # Signed with Apple Distribution and an App Store profile Xcode makes. Stays on the runner.
      - name: Export the App Store .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DaytonaUSA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.NOTARY_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.NOTARY_API_ISSUER_ID }}"
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          ls -l "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        if: needs.setup.outputs.mode != 'build'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Upload to App Store Connect
        if: needs.setup.outputs.mode != 'build'
        env:
          MODE: ${{ needs.setup.outputs.mode }}
          VERSION: ${{ needs.setup.outputs.version }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TESTER_GROUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight_groups || vars.TESTFLIGHT_GROUPS }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          case $MODE in
            testflight|testflight-soft)
              soft=false; [ "$MODE" = testflight-soft ] && soft=true
              bundle exec fastlane ios testflight ipa:"$IPA" platform:${{ matrix.fastlane }} \
                bundle_id:"$BUNDLE_ID" groups:"$TESTER_GROUPS" soft:$soft \
                notes:"$VERSION ($(git log -1 --format='%h %s'))" ;;
            review)
              bundle exec fastlane ios app_store_review ipa:"$IPA" platform:${{ matrix.fastlane }} \
                bundle_id:"$BUNDLE_ID" version:"$VERSION" ;;
            *) echo "::error::Unknown mode $MODE"; exit 1 ;;
          esac

      - name: Remove the keychain, the key and the game-derived files
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -fP "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/branding" "$RUNNER_TEMP/export" "$RUNNER_TEMP/DaytonaUSA.xcarchive" \
                 "$RUNNER_TEMP/dd" build/ci-assets build/x86tr build/${{ matrix.preset }}
